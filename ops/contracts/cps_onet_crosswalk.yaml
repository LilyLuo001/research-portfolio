# W2 crosswalk — the operator that turns the DAX index into treatment.
#
# DAX is built at O*NET task level; a CPS respondent's dose is
#   DAX_c = sum_o weight(c, o) * DAX_o
# so this file's dispersion IS measurement error in the primary regressor, not
# bookkeeping. Reassigned from seat A to the W2-infra lane on 2026-08-18.
#
# One row per (cps_occ, onet_soc) edge. `weight` sums to 1 within cps_occ.
#
# Decision 12 low-quality flag = (dose_sd_within_cps > 0.10) OR
#                                (max_crosswalk_weight < 0.50)
# `max_crosswalk_weight` is computable from the crosswalk alone and is filled
# at build time. `dose_sd_within_cps` needs W3 doses and ships BLANK until
# attach_dose_dispersion runs — blank means "not yet computable", never zero.
#
# coverage_status = ok | equal_weight_fallback_no_employment
#   The fallback keeps an occupation in the panel when every target lacks OEWS
#   employment, but labels every one of its rows so downstream code can drop it
#   rather than inherit a fabricated weighting.
#
# split_rule records that OEWS employment is published at SOC and split equally
# across a SOC's O*NET-SOC children. That is an assumption with no published
# basis, and it moves max_crosswalk_weight directly.
producer: DAX-W2-data
primary_key: [cps_occ, onet_soc]
columns:
  cps_occ: {required: true}
  onet_soc: {required: true}
  soc: {required: true}
  weight: {required: true, min: 0, max: 1}
  employment: {min: 0}
  n_targets: {required: true, min: 1}
  max_crosswalk_weight: {required: true, min: 0, max: 1}
  dose_sd_within_cps: {}
  split_rule: {required: true}
  coverage_status: {required: true}
