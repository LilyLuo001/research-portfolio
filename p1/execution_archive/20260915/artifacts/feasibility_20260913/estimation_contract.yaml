  pooled_weight_counterexample: 'With W_w=I/(W*n_w), A_w=Ztilde_w_prime W_w Ztilde_w. Pooled beta=(sum A_w)^-1 sum A_w beta_w. Scalar weights A_w/sum A_w are information weights, generally not 1/W; vector matrix weights can mix tier effects.'
