timing_contrast:
  status: UNKNOWN
  distinction: 'A significant early beta, or beta_h-beta_T alone, cannot distinguish amplitude from timing.'
  candidate_joint_test:
    status: PROPOSED
    definition: 'Let b0_h be the transported counterfactual SUE-response curve of the target population; beta_h the conversion contrast. Fix or jointly estimate f_h=b0_h/b0_T. Test q_h=beta_h-f_h*beta_T (h<T), jointly; amplitude-only beta_h=a*f_h gives q=0.'
    assumptions: 'Requires identified counterfactual b0 for this exact target/aggregation and amplitude proportionality reference. Different tier baseline shapes need tier-specific amplitude scenarios. Normalization choice is not signed.'
    pure_timing_rule: 'Nonzero directional q plus equivalence of beta_T within a scientifically chosen terminal margin supports redistribution within observed horizon. Terminal non-rejection is not equivalence. Mixed amplitude/timing effects reported as mixed.'
    weak_denominator: 'If b0_T is near zero/sign uncertain, normalized completion fails; use joint level contrasts and report no timing fraction. Estimate joint uncertainty of b0 and beta, including covariance; Fieller/test inversion or valid joint bootstrap, not plug-in denominator.'
    finite_terminal: '+1d close is not fundamental value; post-open terminal is residual response, not total release response.'
    illustrative_shape: 'Conditional fixture only: f=[.25,.50,.70,.85,.95,1]; g=[.20,.20,.15,.10,.05,0]; beta=a*f+t*g. These numbers are arbitrary synthetic scenarios, not empirical calibration.'
  effect_margin:
