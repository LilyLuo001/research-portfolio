compute_contract:
  status: PROPOSED
  authorization: 'Approved here as mathematical instructions for conditional diagnostics, not as a signed empirical estimator or scientific GO; independent referee review remains open.'
  weighted_fwl: 'Q=W^(1/2); Zr=M_(QX0)*QZ; yr=M_(QX0)*Qy; A=Zr_prime*Zr; B=A^-1*Zr_prime*Q; beta_hat=B*y. Sparse/absorbed projections; exact rank audit, no dense NxN projector.'
  covariance: 'V_hk=B_h*Omega_hk*B_k_prime; contrast theta=L*vec(beta), Var(theta)=L*V*L_prime. In same-mask design B_h=B; cross-wave off-diagonal covariance remains. Unweighted scalar reduces to ztilde_prime*Omega*ztilde/(ztilde_prime*ztilde)^2.'
  concentration: 'Report A rank/eigenvalues and row leverage; for scalar contrast influence a=B_prime*c, report group sum a_i^2 and group-score/covariance concentration when justified. Multivariate diagnostics must use chosen L; raw dose^2 ESS is not estimator ESS.'
  direct_fit_check: 'Independent small synthetic fixture comparing full weighted least squares and FWL coefficients/contrasts; separately form B*Omega*B_prime and Monte Carlo variance, including duplicated economic outcomes.'
  conditional_errors: 'Generate unique-event errors first and replicate same draw across stacks. Add stock serial, sponsor exposure-related slope, shared wave/date heterogeneous slope, and cross-horizon errors. Additive shocks absorbed by X0 contribute no residual variance; do not equate them with slope shocks.'
  scenario_labels: 'All absent SUE/calendar/control/mask/covariance replacements ASSUMED_SCENARIO and CONDITIONAL. Existing exposure-only cells can anchor geometry but cannot become actual earnings design.'
  simulation_protocol: 'Fixed seeds/manifests/common draws; null, faster/slower, amplitude-only including unequal baseline curves, mixed effects, dependence and missingness. Full estimator and declared inference. Test size and CI coverage before power; equivalence at zero and near/outside margins.'
  precision: 'Smoke debug first; final cells start ~2000 replications with binomial Monte Carlo intervals. Predeclare precision/cap and decision threshold; unresolved boundary stays unresolved. No final empirical MDE without data.'
  reporting: 'Return outcome in bps: 10000*delta_S*theta for tier contrast; continuous x coefficient uses delta_D/0.005 as well. If simulated y is in assumed SD units multiply by explicitly assumed sigma_h first. Detection MDE80/MDE90 and equivalence probabilities must use actual contrast/test, not critical-value multipliers alone.'
  headline_engine_execution:
    status: NOT_AVAILABLE
    value: 'No Stata/boottest estimation executed by this role. Alternative analytic/known-covariance fixtures cannot certify headline procedure.'
