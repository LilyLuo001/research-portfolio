    - 'Counterfactual slope functions correctly modeled or standardized; merely equal mean-return trends is insufficient. Non-rejected slope pretrends are a diagnostic, not proof.'
    - 'Higher-minus-lower group effects differ from a causal dose increment for the same population. The latter requires slope-level cross-dose transport/strong parallel trends; binning does not remove selection.'
    - 'No omitted exposure-proportional fund/sponsor shocks or earnings-slope industry/time shocks; within-holdings comparisons remove common additive shocks only.'
    - 'Pre-existing ETF saturation, Russell membership shocks, overlapping funds and changing earnings composition do not generate unmodeled differential slope changes.'
